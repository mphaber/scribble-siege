<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scribble Siege has moved</title>
<link rel="canonical" href="https://games.realsparks.net/scribble-siege/">
<meta name="robots" content="noindex">
<script>
var TARGET = "https://games.realsparks.net/scribble-siege/";
try {
  var d = {}, found = false;
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && (k.indexOf("scribbleSiege") === 0)) { var v = localStorage.getItem(k); if (v !== null) { d[k] = v; found = true; } }
  }
  location.replace(TARGET + (found ? "#xfer=" + encodeURIComponent(JSON.stringify(d)) : ""));
} catch (e) { location.replace(TARGET); }
</script>
<meta http-equiv="refresh" content="2; url=https://games.realsparks.net/scribble-siege/">
</head>
<body>
<p>Scribble Siege now lives at <a href="https://games.realsparks.net/scribble-siege/">games.realsparks.net</a>. Taking you there now, with your saved progress carried over.</p>
</body>
</html>
